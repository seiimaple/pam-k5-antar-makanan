      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#a1a1aa" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="720" height="365" rx="16" fill="#181818"/>

  <g fill="none" stroke="#a1a1aa" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#panah)">
    <path d="M307 80 V94 Q307 104 297 104 H140 Q130 104 130 114 V131"/>
    <path d="M360 80 V131"/>
    <path d="M413 80 V94 Q413 104 423 104 H580 Q590 104 590 114 V131"/>
