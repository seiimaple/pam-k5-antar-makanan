<svg xmlns="http://www.w3.org/2000/svg" width="720" height="365" viewBox="0 0 720 365" role="img" aria-labelledby="judul deskripsi">
  <title id="judul">Peta navigasi aplikasi Pesanan Kantin</title>
  <desc id="deskripsi">Menu bawah berisi tab Beranda, Asisten, dan Profil. Di Beranda, klik kartu untuk membuka detail pesanan, atau tekan tombol tambah untuk membuka form pesanan.</desc>

