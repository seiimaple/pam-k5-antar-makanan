    <rect x="66" y="138" width="128" height="58" rx="16"/>
    <rect x="296" y="138" width="128" height="58" rx="16"/>
    <rect x="526" y="138" width="128" height="58" rx="16"/>
    <rect x="43" y="286" width="174" height="58" rx="16"/>
    <rect x="270" y="286" width="180" height="58" rx="16"/>
